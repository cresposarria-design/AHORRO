<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#247a4d">
<title>Mi Ahorro</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f4f6f8;
  color:#18221d;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}

main{
  max-width:580px;
  margin:auto;
  padding:18px 16px 70px
}

h1{
  margin:0 0 4px;
  font-size:28px
}

h3{
  margin-top:0
}

.sub,.small{
  color:#6c766f;
  font-size:13px
}

.card{
  background:#fff;
  border-radius:20px;
  padding:18px;
  margin-top:14px;
  box-shadow:0 5px 22px #14201810
}

.balance{
  font-size:38px;
  font-weight:800;
  margin:5px 0
}

.green{color:#247a4d}
.red{color:#bd3e3e}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px
}

.stat{
  background:#f6f8f6;
  padding:13px;
  border-radius:15px
}

.stat b{
  display:block;
  font-size:19px;
  margin-top:3px
}

input,select{
  width:100%;
  padding:12px;
  border:1px solid #d7ddd9;
  border-radius:11px;
  font-size:16px;
  background:white;
  margin:6px 0 10px
}

button{
  border:0;
  border-radius:12px;
  padding:10px 14px;
  background:#247a4d;
  color:#fff;
  font-weight:700;
  font-size:14px;
  margin:2px
}

button:active{
  transform:scale(.98)
}

.secondary{
  background:#e9eeeb;
  color:#1c3327
}

.danger{
  background:#bd3e3e
}

.row{
  display:flex;
  gap:8px
}

.row>*{
  flex:1
}

.bar{
  height:12px;
  background:#e7ebe8;
  border-radius:20px;
  overflow:hidden;
  margin:12px 0
}

.fill{
  height:100%;
  background:#247a4d;
  width:0;
  transition:width .3s
}

.alert{
  padding:12px;
  border-radius:12px;
  background:#fff3dc;
  color:#8a5600;
  margin-top:10px;
  font-weight:700
}

.dangerbox{
  background:#ffe4e4;
  color:#9b2525
}

.item{
  border-top:1px solid #edf0ee;
  padding:12px 0
}

.itemtop{
  display:flex;
  justify-content:space-between;
  gap:8px
}

.actions{
  text-align:right;
  margin-top:6px
}

.badge{
  font-size:12px;
  background:#eef3ef;
  padding:5px 8px;
  border-radius:20px
}

canvas{
  width:100%;
  height:230px
}

summary{
  list-style:none;
  cursor:pointer
}

summary::-webkit-details-marker{
  display:none
}

.empty{
  text-align:center;
  padding:15px 0;
  color:#6c766f
}
</style>
</head>

<body>
<main>

<h1>Mi Ahorro 💰</h1>
<div class="sub">Controla ingresos, gastos, límites y objetivos</div>

<!-- RESUMEN -->
<section class="card">

  <div class="sub">Disponible</div>
  <div id="available" class="balance green">0,00 €</div>

  <div class="grid">
    <div class="stat">
      <span class="sub">Ingresos</span>
      <b id="income">0,00 €</b>
    </div>

    <div class="stat">
      <span class="sub">Gastos</span>
      <b id="expense">0,00 €</b>
    </div>
  </div>

  <div id="alert"></div>

</section>


<!-- OBJETIVO -->
<section class="card">

<h3>🎯 Objetivo de ahorro</h3>

<label class="sub">Objetivo (€)</label>
<input id="goal" type="number" inputmode="decimal" placeholder="5000">

<label class="sub">Ahorro acumulado (€)</label>
<input id="saved" type="number" inputmode="decimal" placeholder="0">

<button id="saveGoalBtn">Guardar objetivo</button>

<div class="bar">
  <div id="fill" class="fill"></div>
</div>

<div id="goalText" class="small"></div>

</section>


<!-- LIMITE -->
<section class="card">

<h3>🚦 Límite de gasto</h3>

<label class="sub">Límite mensual (€)</label>
<input id="limit" type="number" inputmode="decimal" placeholder="1200">

<label class="sub">Avisar al alcanzar (%)</label>
<input id="warn" type="number" min="1" max="100" inputmode="numeric" placeholder="80">

<button id="saveLimitBtn">Guardar límite</button>

<div id="limitText" class="small"></div>

</section>


<!-- GRAFICO -->
<section class="card" style="padding:0;overflow:hidden">

<details>

<summary style="padding:18px;font-size:18px;font-weight:800">
📊 Gastos por categoría
<span style="float:right">⌄</span>
</summary>

<div style="padding:0 18px 18px">
<canvas id="chart" width="520" height="230"></canvas>
</div>

</details>

</section>


<!-- AÑADIR / EDITAR -->
<section class="card">

<h3 id="formTitle">➕ Añadir movimiento</h3>

<label class="sub">Tipo</label>

<select id="type">
<option value="income">Ingreso</option>
<option value="expense">Gasto</option>
</select>

<label class="sub">Descripción</label>

<input id="desc" placeholder="Ej.: supermercado, nómina...">

<div class="row">

<div>
<label class="sub">Importe</label>
<input id="amount" type="number" inputmode="decimal" placeholder="Importe €">
</div>

<div>
<label class="sub">Categoría</label>

<select id="cat">
<option>Vivienda</option>
<option>Alimentación</option>
<option>Transporte</option>
<option>Ocio</option>
<option>Compras</option>
<option>Salud</option>
<option>Servicios</option>
<option>Otros</option>
</select>

</div>

</div>

<button id="saveMoveBtn">Añadir movimiento</button>

<button id="cancelEditBtn" class="secondary" style="display:none">
Cancelar
</button>

</section>


<!-- MOVIMIENTOS -->
<section class="card">

<h3>📋 Movimientos</h3>

<div id="list"></div>

</section>

</main>


<script>

"use strict";

/* =========================
   DATOS
========================= */

const STORAGE_KEY = "miAhorro";

const DEFAULT_DATA = {
  goal: 5000,
  saved: 0,
  limit: 1200,
  warn: 80,
  moves: []
};

let data;
let editIndex = null;


/* =========================
   ELEMENTOS
========================= */

const availableEl = document.getElementById("available");
const incomeEl = document.getElementById("income");
const expenseEl = document.getElementById("expense");
const alertEl = document.getElementById("alert");

const goalEl = document.getElementById("goal");
const savedEl = document.getElementById("saved");
const fillEl = document.getElementById("fill");
const goalTextEl = document.getElementById("goalText");

const limitEl = document.getElementById("limit");
const warnEl = document.getElementById("warn");
const limitTextEl = document.getElementById("limitText");

const typeEl = document.getElementById("type");
const descEl = document.getElementById("desc");
const amountEl = document.getElementById("amount");
const catEl = document.getElementById("cat");

const formTitleEl = document.getElementById("formTitle");
const saveMoveBtn = document.getElementById("saveMoveBtn");
const cancelEditBtn = document.getElementById("cancelEditBtn");

const saveGoalBtn = document.getElementById("saveGoalBtn");
const saveLimitBtn = document.getElementById("saveLimitBtn");

const listEl = document.getElementById("list");


/* =========================
   MONEDA
========================= */

function euro(number){

  return new Intl.NumberFormat("es-ES",{
    style:"currency",
    currency:"EUR"
  }).format(Number(number) || 0);

}


/* =========================
   CARGAR DATOS
========================= */

function loadData(){

  try{

    const saved = localStorage.getItem(STORAGE_KEY);

    if(saved){

      const parsed = JSON.parse(saved);

      data = {
        ...DEFAULT_DATA,
        ...parsed,
        moves:Array.isArray(parsed.moves) ? parsed.moves : []
      };

    }else{

      data = {
        ...DEFAULT_DATA,
        moves:[]
      };

    }

  }catch(error){

    console.error("Error cargando datos:",error);

    data = {
      ...DEFAULT_DATA,
      moves:[]
    };

  }

}


/* =========================
   GUARDAR
========================= */

function saveData(){

  try{

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(data)
    );

  }catch(error){

    console.error("Error guardando datos:",error);

    alert("No se han podido guardar los datos en este navegador.");

    return false;

  }

  return true;

}


/* =========================
   GUARDAR OBJETIVO
========================= */

function saveGoal(){

  data.goal = Number(goalEl.value) || 0;
  data.saved = Number(savedEl.value) || 0;

  saveData();
  render();

}


/* =========================
   GUARDAR LIMITE
========================= */

function saveLimit(){

  data.limit = Number(limitEl.value) || 0;

  let warning = Number(warnEl.value);

  if(!warning || warning < 1){
    warning = 80;
  }

  if(warning > 100){
    warning = 100;
  }

  data.warn = warning;

  saveData();
  render();

}


/* =========================
   AÑADIR / EDITAR
========================= */

function saveMove(){

  const description = descEl.value.trim();
  const amount = Number(amountEl.value);

  if(!description){

    alert("Escribe una descripción.");

    descEl.focus();

    return;

  }

  if(!amount || amount <= 0){

    alert("Introduce un importe mayor que 0.");

    amountEl.focus();

    return;

  }


  if(editIndex === null){

    const movement = {

      type:typeEl.value,

      desc:description,

      amount:amount,

      cat:catEl.value,

      date:new Date().toLocaleDateString("es-ES")

    };

    data.moves.unshift(movement);

  }else{

    const old = data.moves[editIndex];

    data.moves[editIndex] = {

      type:typeEl.value,

      desc:description,

      amount:amount,

      cat:catEl.value,

      date:old.date || new Date().toLocaleDateString("es-ES")

    };

  }


  if(saveData()){

    resetForm();
    render();

  }

}


/* =========================
   EDITAR
========================= */

function editMove(index){

  const movement = data.moves[index];

  if(!movement){
    return;
  }

  editIndex = index;

  typeEl.value = movement.type;
  descEl.value = movement.desc;
  amountEl.value = movement.amount;
  catEl.value = movement.cat;

  formTitleEl.textContent = "✏️ Editar movimiento";

  saveMoveBtn.textContent = "Guardar cambios";

  cancelEditBtn.style.display = "inline-block";

  window.scrollTo({
    top:document.body.scrollHeight,
    behavior:"smooth"
  });

}


/* =========================
   CANCELAR EDICION
========================= */

function resetForm(){

  editIndex = null;

  typeEl.value = "income";
  descEl.value = "";
  amountEl.value = "";
  catEl.value = "Vivienda";

  formTitleEl.textContent = "➕ Añadir movimiento";

  saveMoveBtn.textContent = "Añadir movimiento";

  cancelEditBtn.style.display = "none";

}


function cancelEdit(){

  resetForm();

}


/* =========================
   BORRAR
========================= */

function deleteMove(index){

  if(!data.moves[index]){
    return;
  }

  const movement = data.moves[index];

  const confirmed = confirm(
    "¿Quieres borrar el movimiento \"" +
    movement.desc +
    "\"?"
  );

  if(!confirmed){
    return;
  }

  data.moves.splice(index,1);

  saveData();
  render();

}


/* =========================
   GRAFICO
========================= */

function drawChart(groups){

  const canvas = document.getElementById("chart");

  const ctx = canvas.getContext("2d");

  const width = canvas.width;
  const height = canvas.height;

  ctx.clearRect(0,0,width,height);

  const names = Object.keys(groups);

  if(!names.length){

    ctx.fillStyle = "#6c766f";
    ctx.font = "15px system-ui";
    ctx.textAlign = "center";

    ctx.fillText(
      "Añade gastos para ver el gráfico",
      width / 2,
      height / 2
    );

    return;

  }

  const values = Object.values(groups);

  const max = Math.max(...values,1);

  const left = 55;
  const bottom = 40;
  const top = 15;

  const usableHeight = height - top - bottom;

  const step =
    (width - left - 20) / names.length;

  const barWidth =
    Math.max(18,step - 12);


  /* Ejes */

  ctx.strokeStyle = "#d9dfda";

  ctx.beginPath();

  ctx.moveTo(left,top);
  ctx.lineTo(left,height-bottom);
  ctx.lineTo(width-10,height-bottom);

  ctx.stroke();


  names.forEach((name,index)=>{

    const value = groups[name];

    const x =
      left + 10 + index * step;

    const barHeight =
      usableHeight * value / max;

    const y =
      height - bottom - barHeight;


    /* Barra */

    ctx.fillStyle = "#247a4d";

    ctx.fillRect(
      x,
      y,
      barWidth,
      barHeight
    );


    /* Nombre */

    ctx.fillStyle = "#47524b";

    ctx.font = "10px system-ui";

    ctx.textAlign = "center";

    ctx.fillText(
      name.slice(0,9),
      x + barWidth / 2,
      height - 12
    );


    /* Importe */

    ctx.fillText(
      euro(value),
      x + barWidth / 2,
      Math.max(12,y-5)
    );

  });

}


/* =========================
   RENDER
========================= */

function render(){

  /* Campos */

  goalEl.value = data.goal;
  savedEl.value = data.saved;

  limitEl.value = data.limit;
  warnEl.value = data.warn;


  /* Totales */

  let income = 0;
  let expense = 0;


  data.moves.forEach(move=>{

    const amount = Number(move.amount) || 0;

    if(move.type === "income"){

      income += amount;

    }else{

      expense += amount;

    }

  });


  const available =
    income - expense;


  incomeEl.textContent = euro(income);

  expenseEl.textContent = euro(expense);

  availableEl.textContent = euro(available);

  availableEl.className =
    "balance " +
    (available < 0 ? "red" : "green");


  /* Objetivo */

  const goal =
    Number(data.goal) || 0;

  const saved =
    Number(data.saved) || 0;

  const percentage =
    goal > 0
    ? Math.min(100,(saved / goal) * 100)
    : 0;


  fillEl.style.width =
    percentage + "%";


  goalTextEl.textContent =
    percentage.toFixed(0) +
    "% conseguido · faltan " +
    euro(Math.max(0,goal-saved));


  /* Limite */

  const limit =
    Number(data.limit) || 0;

  const percentageLimit =
    limit > 0
    ? (expense / limit) * 100
    : 0;


  if(limit > 0 && percentageLimit >= 100){

    alertEl.innerHTML =
      '<div class="alert dangerbox">' +
      '🚨 Has superado tu límite: ' +
      euro(expense) +
      ' de ' +
      euro(limit) +
      '.' +
      '</div>';

  }else if(limit > 0 && percentageLimit >= data.warn){

    alertEl.innerHTML =
      '<div class="alert">' +
      '⚠️ Has usado el ' +
      percentageLimit.toFixed(0) +
      '% de tu límite.' +
      '</div>';

  }else{

    alertEl.innerHTML = "";

  }


  if(limit > 0){

    limitTextEl.textContent =
      "Has gastado " +
      euro(expense) +
      " de " +
      euro(limit) +
      " (" +
      percentageLimit.toFixed(0) +
      "%).";

  }else{

    limitTextEl.textContent =
      "Configura un límite mensual.";

  }


  /* Grafico */

  const groups = {};

  data.moves
    .filter(move => move.type === "expense")
    .forEach(move=>{

      const category =
        move.cat || "Otros";

      groups[category] =
        (groups[category] || 0) +
        (Number(move.amount) || 0);

    });


  drawChart(groups);


  /* Lista */

  if(!data.moves.length){

    listEl.innerHTML =
      '<div class="empty">' +
      'Todavía no hay movimientos.' +
      '</div>';

    return;

  }


  listEl.innerHTML =
    data.moves.map((move,index)=>{

      const isIncome =
        move.type === "income";

      const sign =
        isIncome ? "+" : "-";

      const color =
        isIncome ? "green" : "red";


      return `
      <div class="item">

        <div class="itemtop">

          <div>

            <b>${escapeHTML(move.desc)}</b>

            <div class="small">
              ${escapeHTML(move.date || "")}
              ·
              ${escapeHTML(move.cat || "Otros")}
            </div>

          </div>

          <b class="${color}">
            ${sign}${euro(move.amount)}
          </b>

        </div>

        <div class="actions">

          <button
            class="secondary"
            data-edit="${index}">
            ✏️ Editar
          </button>

          <button
            class="danger"
            data-delete="${index}">
            🗑️ Borrar
          </button>

        </div>

      </div>
      `;

    }).join("");

}


/* =========================
   SEGURIDAD TEXTO
========================= */

function escapeHTML(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================
   EVENTOS
========================= */

saveGoalBtn.addEventListener(
  "click",
  saveGoal
);

saveLimitBtn.addEventListener(
  "click",
  saveLimit
);

saveMoveBtn.addEventListener(
  "click",
  saveMove
);

cancelEditBtn.addEventListener(
  "click",
  cancelEdit
);


/* Botones de editar/borrar */

listEl.addEventListener(
  "click",
  function(event){

    const editButton =
      event.target.closest("[data-edit]");

    if(editButton){

      const index =
        Number(editButton.dataset.edit);

      editMove(index);

      return;

    }


    const deleteButton =
      event.target.closest("[data-delete]");

    if(deleteButton){

      const index =
        Number(deleteButton.dataset.delete);

      deleteMove(index);

    }

  }
);


/* =========================
   INICIO
========================= */

loadData();

render();

</script>

</body>
</html>
