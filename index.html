<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#247a4d"><link rel="manifest" href="manifest.json">
<title>Mi Ahorro</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#18221d;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:560px;margin:auto;padding:18px 16px 90px}.top{display:flex;justify-content:space-between;align-items:center}
h1{margin:0;font-size:28px}.sub{color:#6c766f;font-size:13px}.card{background:#fff;border-radius:20px;padding:18px;margin-top:14px;box-shadow:0 5px 22px #14201810}
.balance{font-size:38px;font-weight:800;margin:5px 0}.green{color:#247a4d}.red{color:#bd3e3e}
.bar{height:12px;background:#e7ebe8;border-radius:20px;overflow:hidden;margin:12px 0}.fill{height:100%;background:#247a4d;width:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#f6f8f6;padding:13px;border-radius:15px}.stat b{display:block;font-size:19px;margin-top:3px}
input,select{width:100%;padding:12px;border:1px solid #d7ddd9;border-radius:11px;font-size:16px;background:white;margin:6px 0 10px}
button{border:0;border-radius:12px;padding:12px 15px;background:#247a4d;color:#fff;font-weight:700;font-size:15px}.secondary{background:#e9efeb;color:#1e5135}
.row{display:flex;gap:8px}.row>*{flex:1}
.item{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #edf0ee;padding:12px 0}.item:first-child{border-top:0}
.badge{font-size:12px;background:#eef3ef;padding:5px 8px;border-radius:20px}.empty{text-align:center;color:#778078;padding:15px}
.small{font-size:12px;color:#717b74}
</style></head>
<body><main>
<div class="top"><div><h1>Mi Ahorro 💰</h1><div class="sub">Controla tus ingresos y gastos</div></div></div>

<section class="card">
<div class="sub">Disponible este mes</div><div id="available" class="balance">0 €</div>
<div class="grid">
<div class="stat"><span class="sub">Ingresos</span><b id="income">0 €</b></div>
<div class="stat"><span class="sub">Gastos</span><b id="expense">0 €</b></div>
</div></section>

<section class="card">
<h3>🎯 Objetivo de ahorro</h3>
<label class="sub">Objetivo (€)</label><input id="goal" type="number" step=".01" min="0" value="5000">
<label class="sub">Ahorro acumulado (€)</label><input id="saved" type="number" step=".01" min="0" value="0">
<button onclick="saveGoal()">Guardar objetivo</button>
<div class="bar"><div id="fill" class="fill"></div></div><div id="goalText" class="small"></div>
</section>

<section class="card">
<h3>➕ Añadir movimiento</h3>
<select id="type"><option value="income">Ingreso</option><option value="expense">Gasto</option></select>
<input id="desc" placeholder="Ej.: supermercado, nómina...">
<div class="row"><input id="amount" type="number" min="0" step=".01" placeholder="Importe €">
<select id="cat"><option>Vivienda</option><option>Alimentación</option><option>Transporte</option><option>Ocio</option><option>Compras</option><option>Salud</option><option>Servicios</option><option>Otros</option></select></div>
<button onclick="add()">Añadir movimiento</button>
</section>

<section class="card"><h3>📋 Movimientos</h3><div id="list"></div></section>
</main>
<script>
const K="miAhorroV2";let d=JSON.parse(localStorage.getItem(K)||'{"goal":5000,"saved":0,"moves":[]}');
const euro=n=>new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'}).format(n);
function persist(){localStorage.setItem(K,JSON.stringify(d));render()}
function saveGoal(){d.goal=+goal.value||0;d.saved=+saved.value||0;persist()}
function add(){let a=+amount.value||0, x=desc.value.trim();if(!a||!x)return;
d.moves.unshift({type:type.value,desc:x,amount:a,cat:cat.value,date:new Date().toLocaleDateString('es-ES')});
desc.value="";amount.value="";persist()}
function del(i){d.moves.splice(i,1);persist()}
function render(){
goal.value=d.goal;saved.value=d.saved;
let inc=d.moves.filter(x=>x.type==="income").reduce((s,x)=>s+x.amount,0), exp=d.moves.filter(x=>x.type==="expense").reduce((s,x)=>s+x.amount,0);
income.textContent=euro(inc);expense.textContent=euro(exp);available.textContent=euro(inc-exp);
available.className="balance "+(inc-exp<0?"red":"green");
let p=d.goal?Math.min(100,d.saved/d.goal*100):0;fill.style.width=p+"%";goalText.textContent=`${p.toFixed(0)}% conseguido · faltan ${euro(Math.max(0,d.goal-d.saved))}`;
list.innerHTML=d.moves.length?d.moves.map((x,i)=>`<div class="item"><div><b>${x.desc}</b><div class="small">${x.date} · <span class="badge">${x.cat}</span></div></div><div style="text-align:right"><b class="${x.type==='income'?'green':'red'}">${x.type==='income'?'+':'-'}${euro(x.amount)}</b><br><button class="secondary" onclick="del(${i})">Borrar</button></div></div>`).join(""):'<div class="empty">Todavía no hay movimientos.</div>';
}
render();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script></body></html>
